name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - content-updated
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Theme Repository
        uses: actions/checkout@v4

      - name: Checkout Content Repository
        uses: actions/checkout@v4
        with:
          repository: QuQawsl/Blog-Shirone-Content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: external-content

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Content and Build
        env:
          CONTENT_DIR: ./external-content
        run: |
          pnpm content:sync
          pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shirone-blog --branch=main
